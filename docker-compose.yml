# Calling CRM: the full stack on one host (local evaluation or a single-server deployment).
#
#   cp .env.example .env            # fill in every secret; never commit .env
#   docker compose up -d --build
#   docker compose run --rm api node dist/scripts/bootstrap-admin.js --email you@example.com --name "Your Name"
#
# Then open PUBLIC_BASE_URL (http://localhost:8080 by default). Postgres and Redis are not
# published to the host; see docker-compose.dev.yml for local development against them.
name: calling-crm

x-api-build: &api-build
  context: .
  dockerfile: apps/api/Dockerfile

x-logging: &logging
  driver: json-file
  options: { max-size: 10m, max-file: "5" }

# Application containers run as the unprivileged node user on a read-only root filesystem.
x-hardening: &hardening
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: [/tmp]
  logging: *logging

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgresql://crm:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/crm?schema=public
  REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
  APP_SECRET: ${APP_SECRET:?set APP_SECRET in .env}
  DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?set DATA_ENCRYPTION_KEY in .env}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
  WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
  COOKIE_SECURE: "true"
  TRUST_PROXY: ${TRUST_PROXY:-1}
  TELEPHONY_DEFAULT_PROVIDER: ${TELEPHONY_DEFAULT_PROVIDER:-mock}
  ALLOW_MOCK_PROVIDER: ${ALLOW_MOCK_PROVIDER:-false}
  ALLOW_MOCK_CONTROLS: ${ALLOW_MOCK_CONTROLS:-false}
  WHATSAPP_ALLOW_MOCK: ${WHATSAPP_ALLOW_MOCK:-false}
  MOCK_TIME_SCALE: ${MOCK_TIME_SCALE:-1}
  PLIVO_AUTH_ID: ${PLIVO_AUTH_ID:-}
  PLIVO_AUTH_TOKEN: ${PLIVO_AUTH_TOKEN:-}
  PLIVO_CALLER_ID: ${PLIVO_CALLER_ID:-}
  SMTP_URL: ${SMTP_URL:-}
  MAIL_FROM: ${MAIL_FROM:-Calling CRM <no-reply@localhost>}
  STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
  STORAGE_DIR: /data/storage
  S3_BUCKET: ${S3_BUCKET:-}
  S3_REGION: ${S3_REGION:-ap-south-1}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  ENABLE_API_DOCS: ${ENABLE_API_DOCS:-false}

services:
  postgres:
    image: postgres:16.10-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: crm
      POSTGRES_DB: crm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4.6-alpine
    restart: unless-stopped
    logging: *logging
    # BullMQ needs persistence and must never have its keys evicted.
    command: ["sh", "-c", 'exec redis-server --appendonly yes --maxmemory-policy noeviction --requirepass "$$REDIS_PASSWORD"']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    image: calling-crm/api:${CRM_IMAGE_TAG:-local}
    build: *api-build
    <<: *hardening
    command: ["/app/node_modules/.bin/prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://crm:${POSTGRES_PASSWORD}@postgres:5432/crm?schema=public
    healthcheck: { disable: true }
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }

  api:
    image: calling-crm/api:${CRM_IMAGE_TAG:-local}
    build: *api-build
    <<: *hardening
    restart: unless-stopped
    environment: *app-env
    volumes:
      - app_storage:/data/storage
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    image: calling-crm/api:${CRM_IMAGE_TAG:-local}
    build: *api-build
    <<: *hardening
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    environment: *app-env
    volumes:
      - app_storage:/data/storage
    healthcheck: { disable: true }
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  web:
    image: calling-crm/web:${CRM_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_INTERNAL_URL: http://api:4000
        NEXT_PUBLIC_PRODUCT_NAME: ${NEXT_PUBLIC_PRODUCT_NAME:-}
    <<: *hardening
    tmpfs: [/tmp, /app/apps/web/.next/cache]
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    logging: *logging
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_healthy }

volumes:
  postgres_data:
  redis_data:
  app_storage:
  caddy_data:
  caddy_config:
