# Local development: run only Postgres and Redis in containers, published on loopback, and run the
# API, worker and web app on the host with hot reload (npm run dev).
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d postgres redis
#
# Then point apps/api/.env at them (see apps/api/.env.example):
#   DATABASE_URL=postgresql://crm:<POSTGRES_PASSWORD>@localhost:5432/crm?schema=public
#   REDIS_URL=redis://:<REDIS_PASSWORD>@localhost:6379/0
services:
  postgres:
    ports: ["127.0.0.1:5432:5432"]
  redis:
    ports: ["127.0.0.1:6379:6379"]
